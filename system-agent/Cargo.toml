[package]
name = "system-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.9"
nix = "0.27"
libc = "0.2"
lazy_static = "1.4"
uuid = { version = "1.4", features = ["v4", "serde"] }
systemd = { version = "0.10", optional = true }
aya = { version = "0.11", optional = true }
aya-log = { version = "0.1", optional = true }
clap = { version = "4.4", features = ["derive"] }
prometheus = "0.13"
hyper = { version = "0.14", features = ["full"] }
bytes = "1.5"
futures = "0.3"
dirs = "5.0"
procfs = "0.15"
hostname = "0.4.1"

[features]
default = ["systemd", "ebpf"]
systemd = ["dep:systemd"]
ebpf = ["dep:aya", "dep:aya-log"]

[lib]
name = "system_agent"
path = "src/lib.rs"

[[bin]]
name = "system-agent"
path = "src/main.rs"
